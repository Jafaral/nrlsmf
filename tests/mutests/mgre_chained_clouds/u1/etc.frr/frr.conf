log file /var/log/frr/frr.log
!
! Underlay for cloud1 (NHRP-resolved mGRE). Disconnected from every
! other segment at the IP layer, same as u0. No nrlsmf role: NHRP
! resolves peers to unicast underlay addresses, so no multicast
! relay is needed on this underlay either.
!
interface eth0
 ip address 10.1.0.1/24
!
interface eth1
 ip address 10.1.1.1/24
!
interface eth2
 ip address 10.1.2.1/24
!
