!
! E: SMF router between cloud3 (via u3) and
! cloud4 (via u4). Same principle throughout this
! topology: no route between cloud3's and cloud4's addressing -- only
! nrlsmf `cf` across E's two overlay interfaces connects the two.
!
ip route 10.3.0.0/16 10.3.1.1
ip route 10.4.0.0/16 10.4.0.1
!
interface eth0
 ip address 10.3.1.2/24
!
interface eth1
 ip address 10.4.0.2/24
!
