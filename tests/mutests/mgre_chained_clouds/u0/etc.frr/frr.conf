log file /var/log/frr/frr.log
!
! Underlay for cloud0 (static NBMA mGRE). Routes only within cloud0's
! own addressing; no route to any other segment. Plays no active
! nrlsmf role -- cloud0 uses unicast peer-resolution (a static
! neighbor table), not multicast fan-out, so no underlay multicast
! relay is needed here.
!
interface eth0
 ip address 10.0.0.1/24
!
interface eth1
 ip address 10.0.1.1/24
!
interface eth2
 ip address 10.0.2.1/24
!
