log file /var/log/frr/frr.log
!
! Underlay for cloud2 (multicast-underlay mGRE). Unlike u0/u1, this
! underlay DOES run nrlsmf -- `rmerge` across all three of its LANs,
! as a stand-in for real multicast routing (e.g. PIM) -- since
! cloud2's GRE tunnels rely on underlay multicast fan-out rather than
! a per-peer table. This is the one place in this topology where
! nrlsmf uses `merge`/`rmerge` instead of `cf`: it's acting as the
! underlay's multicast routing, not as an overlay SMF router.
!
interface eth0
 ip address 10.2.0.1/24
!
interface eth1
 ip address 10.2.1.1/24
!
interface eth2
 ip address 10.2.2.1/24
!
