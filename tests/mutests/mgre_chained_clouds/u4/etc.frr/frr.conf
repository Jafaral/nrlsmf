log file /var/log/frr/frr.log
!
! Underlay for cloud4 (external/metadata GRE). Disconnected from
! every other segment. No nrlsmf role: encapsulation is resolved by
! per-destination lwtunnel routes on each peer, not by anything the
! underlay itself needs to do.
!
interface eth0
 ip address 10.4.0.1/24
!
interface eth1
 ip address 10.4.1.1/24
!
interface eth2
 ip address 10.4.2.1/24
!
