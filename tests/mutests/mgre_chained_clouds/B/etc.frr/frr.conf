log file /var/log/frr/frr.log
!
! B: SMF router between cloud0 (via u0) and cloud1
! (via u1). No default route, and no route between cloud0's and
! cloud1's addressing -- each interface only routes into its own
! segment's underlay. The only thing connecting cloud0 traffic to
! cloud1 is nrlsmf running in classical-flooding (`cf`) mode across
! both of B's overlay (GRE) interfaces -- never IP routing.
!
ip route 10.0.0.0/16 10.0.2.1
ip route 10.1.0.0/16 10.1.0.1
!
interface eth0
 ip address 10.0.2.2/24
!
interface eth1
 ip address 10.1.0.2/24
!
