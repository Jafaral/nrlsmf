log file /var/log/frr/frr.log
!
! r3: SMF router. eth0 is the underlay toward u0; eth1 is the host
! LAN toward h3 (iperf receiver). In the NHRP mutest, r3 additionally
! takes on the hub/NHRP-Server (NHS) role -- always on an
! operator-controlled router, never on the untrusted underlay (u0).
!
ip route 0.0.0.0/0 10.0.3.1
!
interface eth0
 ip address 10.0.3.2/24
!
interface eth1
 ip address 192.168.58.1/24
!
