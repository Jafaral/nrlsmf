log file /var/log/frr/frr.log
!
! Underlay ("u0"): routes ordinary IP traffic between the four LANs.
! Plays no active GRE/nrlsmf role except in the multicast-underlay test,
! where it relays multicast between the LANs as a pure dataplane helper.
!
interface eth0
 ip address 10.0.0.1/24
!
interface eth1
 ip address 10.0.1.1/24
!
interface eth2
 ip address 10.0.2.1/24
!
interface eth3
 ip address 10.0.3.1/24
!
