log file /var/log/frr/frr.log
!
! Underlay ("u0"): unicast among all five LANs. nrlsmf rmerge on
! eth0..eth2 only (see mutest) so r0/r1/r2 see underlay multicast
! and r3/r4 do not.
!
interface eth0
 ip address 10.0.0.1/24
!
interface eth1
 ip address 10.0.1.1/24
!
interface eth2
 ip address 10.0.2.1/24
!
interface eth3
 ip address 10.0.3.1/24
!
interface eth4
 ip address 10.0.4.1/24
!
